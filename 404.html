<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>404 — Page Not Found | Kevin Yi (@yikaus)</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <script>
    (function () {
      try {
        var saved = localStorage.getItem('theme');
        if (saved === 'light' || saved === 'dark') {
          document.documentElement.setAttribute('data-theme', saved);
        } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      } catch (e) {}
    })();
  </script>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="/">
        <span class="brand-prompt" aria-hidden="true">&gt;_</span>
        <span>yikaus.github.io</span>
      </a>
    </div>
  </header>

  <main class="not-found">
    <div class="not-found-card">
      <div class="yaml-card">
        <div class="yaml-bar">
          <div class="yaml-title-group">
            <div class="window-dots" aria-hidden="true">
              <span></span><span></span><span></span>
            </div>
            <span class="yaml-filename">error.yaml</span>
          </div>
        </div>
        <pre class="yaml-body"><code><span class="y-doc">---</span>
<span class="y-key">status</span>: <span class="y-val">404</span>
<span class="y-key">message</span>: <span class="y-str">"Page not found"</span>
<span class="y-key">home</span>: <span class="y-val">https://yikaus.github.io/</span></code></pre>
      </div>
      <a class="btn-primary" href="/">&larr; Back to home</a>
    </div>
  </main>
</body>
</html>
